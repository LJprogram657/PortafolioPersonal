<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin Conexión — Alvaro Leonardo Baquero</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .offline-wrapper {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
        z-index: 1;
      }
      .offline-card {
        max-width: 460px;
        width: 100%;
        padding: 40px 32px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .offline-icon {
        font-size: 3rem;
        margin-bottom: 8px;
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main class="offline-wrapper">
      <div class="card-glass offline-card">
        <div class="offline-icon">📡</div>
        <h1 style="font-family: var(--font-heading); font-size: 1.6rem; color: var(--text-main);">Sin Conexión a Internet</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
          Parece que has perdido la conexión a la red. El contenido guardado en caché sigue disponible para ti.
        </p>
        <button onclick="window.location.reload()" class="btn btn-primary" style="margin-top: 8px;">
          Reintentar Conexión
        </button>
      </div>
    </main>
  </body>
</html>
